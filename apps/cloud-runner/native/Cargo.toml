[package]
name = "machdoch-cloud-supervisor"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
windows-storage = []

[[bin]]
name = "machdoch-cloud-storage"
path = "src/storage.rs"
required-features = ["windows-storage"]

[dependencies]
base64 = "0.22"
machdoch-process = { path = "../../../packages/process-supervisor" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
uds_windows = "=1.2.1"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_Storage_Vhd", "Win32_System_IO"] }
