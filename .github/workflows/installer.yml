name: Manual Build Installers

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            asset_platform: windows
            artifact_name: installers-windows
          - platform: ubuntu-24.04
            asset_platform: linux
            artifact_name: installers-linux
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.13
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev libgbm-dev librsvg2-dev libpipewire-0.3-dev libspa-0.2-dev patchelf

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build Tauri installers
        shell: bash
        run: pnpm tauri:build

      - name: List bundle outputs
        shell: bash
        run: |
          ls -la apps/client/src-tauri/target/release/bundle || true
          find apps/client/src-tauri/target/release/bundle -maxdepth 3 -type f || true

      - name: Prepare canonical installer assets
        id: assets
        shell: bash
        run: >-
          node .github/scripts/release-assets.mjs prepare
          "${{ matrix.asset_platform }}"
          apps/client/src-tauri/target/release/bundle
          release-assets
          apps/client/src-tauri/tauri.conf.json
          "$GITHUB_OUTPUT"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ steps.assets.outputs.paths }}
          if-no-files-found: error

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          artifact-name: sbom-${{ matrix.platform }}.spdx.json
          output-file: sbom-${{ matrix.platform }}.spdx.json
          format: spdx-json
          upload-release-assets: false

      - name: Attest build provenance
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.assets.outputs.paths }}

      - name: Attest SBOM
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-sbom@v3
        with:
          subject-path: ${{ steps.assets.outputs.paths }}
          sbom-path: sbom-${{ matrix.platform }}.spdx.json
