name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      release_id: ${{ steps.release.outputs.release_id }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      version: ${{ steps.version.outputs.version }}
      publish_on_success: ${{ steps.release.outputs.publish_on_success }}
      delete_on_failure: ${{ steps.release.outputs.delete_on_failure }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version and ensure release tag
        id: version
        shell: bash
        env:
          CURRENT_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');

          const beforeSha = process.env.BEFORE_SHA ?? '';
          const currentSha = process.env.CURRENT_SHA;
          const defaultBranch = process.env.DEFAULT_BRANCH;
          const eventName = process.env.EVENT_NAME;
          const outputPath = process.env.GITHUB_OUTPUT;
          const refName = process.env.REF_NAME;
          const refType = process.env.REF_TYPE;

          const setOutput = (name, value) => {
            fs.appendFileSync(outputPath, `${name}=${value}\n`);
          };

          const readJsonFile = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const readVersionAtRevision = (revision, path) => {
            try {
              return (
                JSON.parse(
                  execFileSync('git', ['show', `${revision}:${path}`], {
                    encoding: 'utf8',
                    stdio: ['ignore', 'pipe', 'ignore'],
                  }),
                ).version ?? ''
              );
            } catch {
              return '';
            }
          };

          const packageVersion = readJsonFile('package.json').version ?? '';
          const clientVersion = readJsonFile('apps/client/package.json').version ?? '';
          const fleetManagerVersion =
            readJsonFile('apps/fleet-manager/package.json').version ?? '';
          const landingVersion = readJsonFile('apps/landing/package.json').version ?? '';
          const tauriVersion =
            readJsonFile('apps/client/src-tauri/tauri.conf.json').version ?? '';

          if (!packageVersion) {
            console.error('package.json is missing a version.');
            process.exit(1);
          }

          if (!tauriVersion) {
            console.error(
              'apps/client/src-tauri/tauri.conf.json is missing a version.',
            );
            process.exit(1);
          }

          if (!clientVersion) {
            console.error('apps/client/package.json is missing a version.');
            process.exit(1);
          }

          if (!landingVersion) {
            console.error('apps/landing/package.json is missing a version.');
            process.exit(1);
          }

          if (!fleetManagerVersion) {
            console.error('apps/fleet-manager/package.json is missing a version.');
            process.exit(1);
          }

          if (
            packageVersion !== clientVersion ||
            packageVersion !== fleetManagerVersion ||
            packageVersion !== landingVersion ||
            packageVersion !== tauriVersion
          ) {
            console.error(
              `Release versions do not match: package.json=${packageVersion}, apps/client/package.json=${clientVersion}, apps/fleet-manager/package.json=${fleetManagerVersion}, apps/landing/package.json=${landingVersion}, apps/client/src-tauri/tauri.conf.json=${tauriVersion}.`,
            );
            process.exit(1);
          }

          const version = packageVersion;
          const tagName = `v${version}`;

          if (refType === 'tag') {
            if (refName !== tagName) {
              console.error(
                `Expected tag ${tagName} for version ${version}, but this workflow ran for ${refName}.`,
              );
              process.exit(1);
            }

            setOutput('should_release', 'true');
            setOutput('tag_name', tagName);
            setOutput('version', version);
            process.exit(0);
          }

          if (refName !== defaultBranch) {
            console.error(
              `Releases can only be created from ${defaultBranch} or a version tag. This workflow ran for ${refName}.`,
            );
            process.exit(1);
          }

          if (eventName === 'push') {
            const hasBeforeRevision = beforeSha.length > 0 && !/^0+$/.test(beforeSha);

            if (hasBeforeRevision) {
              const previousPackageVersion = readVersionAtRevision(beforeSha, 'package.json');

              if (previousPackageVersion === version) {
                console.log(
                  `Version stayed at ${version}; skipping the release pipeline for this push.`,
                );
                setOutput('should_release', 'false');
                setOutput('tag_name', tagName);
                setOutput('version', version);
                process.exit(0);
              }
            }
          }

          let existingTagCommit = '';

          try {
            existingTagCommit = execFileSync('git', ['rev-list', '-n', '1', tagName], {
              encoding: 'utf8',
              stdio: ['ignore', 'pipe', 'ignore'],
            }).trim();
          } catch {
            existingTagCommit = '';
          }

          if (existingTagCommit && existingTagCommit !== currentSha) {
            console.error(
              `Tag ${tagName} already exists at ${existingTagCommit}, but this workflow is building ${currentSha}. Bump the app version or remove the conflicting tag.`,
            );
            process.exit(1);
          }

          if (!existingTagCommit) {
            execFileSync('git', ['config', 'user.name', 'github-actions[bot]'], {
              stdio: 'inherit',
            });
            execFileSync(
              'git',
              ['config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'],
              { stdio: 'inherit' },
            );
            execFileSync('git', ['tag', '-a', tagName, currentSha, '-m', `Release ${tagName}`], {
              stdio: 'inherit',
            });
            execFileSync('git', ['push', 'origin', `refs/tags/${tagName}`], {
              stdio: 'inherit',
            });
          }

          setOutput('should_release', 'true');
          setOutput('tag_name', tagName);
          setOutput('version', version);
          NODE

      - name: Create or reuse GitHub release
        id: release
        if: steps.version.outputs.should_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          RELEASE_TITLE: machdoch ${{ steps.version.outputs.tag_name }}
        shell: bash
        run: |
          if gh release view "$TAG_NAME" --json databaseId,isDraft >/dev/null 2>&1; then
            release_id="$(gh release view "$TAG_NAME" --json databaseId --jq '.databaseId')"
            is_draft="$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft')"

            gh release edit "$TAG_NAME" --title "$RELEASE_TITLE"

            if [ "$is_draft" = "true" ]; then
              echo "publish_on_success=true" >> "$GITHUB_OUTPUT"
            else
              echo "publish_on_success=false" >> "$GITHUB_OUTPUT"
            fi

            echo "delete_on_failure=false" >> "$GITHUB_OUTPUT"
          else
            gh release create "$TAG_NAME" \
              --title "$RELEASE_TITLE" \
              --generate-notes \
              --draft

            release_id="$(gh release view "$TAG_NAME" --json databaseId --jq '.databaseId')"
            echo "publish_on_success=true" >> "$GITHUB_OUTPUT"
            echo "delete_on_failure=true" >> "$GITHUB_OUTPUT"
          fi

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build-and-release:
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            container: ""
            release_target: windows-x64
            bundle_args: "--bundles msi,nsis"
            debian_architecture: ""
            debian_asset: ""
            rpm_architecture: ""
            rpm_asset: ""
          - runner: ubuntu-24.04
            container: debian:12-slim
            release_target: linux-amd64
            bundle_args: "--bundles deb,rpm,appimage"
            debian_architecture: amd64
            debian_asset: release-assets/machdoch-linux-amd64.deb
            rpm_architecture: x86_64
            rpm_asset: release-assets/machdoch-linux-x86_64.rpm
          - runner: ubuntu-24.04-arm
            container: debian:12-slim
            release_target: linux-arm64
            bundle_args: "--bundles deb"
            debian_architecture: arm64
            debian_asset: release-assets/machdoch-linux-arm64.deb
            rpm_architecture: ""
            rpm_asset: ""
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Install Linux build dependencies
        if: startsWith(matrix.release_target, 'linux-')
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils \
            build-essential \
            ca-certificates \
            clang \
            cmake \
            cpio \
            curl \
            file \
            gh \
            git \
            libayatana-appindicator3-dev \
            libclang-dev \
            libgbm-dev \
            libpipewire-0.3-dev \
            librsvg2-dev \
            libspa-0.2-dev \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            patchelf \
            pkg-config \
            python3 \
            rpm \
            systemd \
            wget \
            xdg-utils \
            xz-utils
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v7

      - name: Trust workspace
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Stage ONNX Runtime
        if: startsWith(matrix.release_target, 'linux-')
        shell: bash
        run: .github/scripts/stage-onnx-runtime.sh "${{ runner.arch }}"

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@22.13
          cache: true
          install: false

      - name: Install Rust stable
        if: matrix.release_target == 'windows-x64'
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build Linux release assets
        if: startsWith(matrix.release_target, 'linux-')
        shell: bash
        env:
          TAURI_LINUX_AYATANA_APPINDICATOR: "true"
          ORT_LIB_LOCATION: ${{ github.workspace }}/apps/client/src-tauri/target/onnxruntime
          ORT_PREFER_DYNAMIC_LINK: "true"
          ORT_SKIP_DOWNLOAD: "true"
          RUSTFLAGS: -C link-arg=-Wl,-rpath,$ORIGIN/../lib/machdoch
        run: pnpm --filter @machdoch/client tauri build ${{ matrix.bundle_args }}

      - name: Build non-Linux release assets
        if: "!startsWith(matrix.release_target, 'linux-')"
        shell: bash
        run: pnpm --filter @machdoch/client tauri build ${{ matrix.bundle_args }}

      - name: List bundle outputs
        shell: bash
        run: |
          ls -la apps/client/src-tauri/target/release/bundle || true
          find apps/client/src-tauri/target/release/bundle -maxdepth 3 -type f || true

      - name: Prepare canonical release assets
        id: assets
        shell: bash
        run: >-
          node .github/scripts/release-assets.mjs prepare
          "${{ matrix.release_target }}"
          apps/client/src-tauri/target/release/bundle
          release-assets
          apps/client/src-tauri/tauri.conf.json
          "$GITHUB_OUTPUT"

      - name: Build and verify headless Linux package
        id: headless
        if: matrix.release_target == 'linux-amd64'
        shell: bash
        run: |
          pnpm build:headless
          node .github/scripts/verify-headless-package.mjs apps/client/dist/machdoch-headless.tar.gz
          cp apps/client/dist/machdoch-headless.tar.gz release-assets/
          echo "path=release-assets/machdoch-headless.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Verify Debian package
        if: matrix.debian_architecture != ''
        shell: bash
        run: >-
          node .github/scripts/verify-linux-package.mjs deb
          "${{ matrix.debian_asset }}"
          "${{ matrix.debian_architecture }}"
          apps/client/src-tauri/tauri.conf.json

      - name: Verify RPM package
        if: matrix.rpm_architecture != ''
        shell: bash
        run: >-
          node .github/scripts/verify-linux-package.mjs rpm
          "${{ matrix.rpm_asset }}"
          "${{ matrix.rpm_architecture }}"
          apps/client/src-tauri/tauri.conf.json

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare-release.outputs.tag_name }}
        shell: bash
        run: |
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            gh release upload "$TAG_NAME" "$file" --clobber
          done <<'EOF'
          ${{ steps.assets.outputs.paths }}
          ${{ steps.headless.outputs.path }}
          EOF

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          artifact-name: sbom-${{ matrix.release_target }}.spdx.json
          output-file: sbom-${{ matrix.release_target }}.spdx.json
          format: spdx-json
          upload-release-assets: false

      - name: Attest build provenance
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            ${{ steps.assets.outputs.paths }}
            ${{ steps.headless.outputs.path }}

      - name: Attest SBOM
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-sbom@v3
        with:
          subject-path: |
            ${{ steps.assets.outputs.paths }}
            ${{ steps.headless.outputs.path }}
          sbom-path: sbom-${{ matrix.release_target }}.spdx.json

  build-and-publish-landing:
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}-landing
    steps:
      - uses: actions/checkout@v7

      - name: Validate landing URL
        env:
          MACHDOCH_LANDING_URL: ${{ vars.MACHDOCH_LANDING_URL }}
        shell: bash
        run: |
          node <<'NODE'
          const value = process.env.MACHDOCH_LANDING_URL?.trim();

          const fail = (message) => {
            console.error(`MACHDOCH_LANDING_URL ${message}`);
            process.exit(1);
          };

          if (!value) {
            fail('must be set to a valid trailing-slash HTTPS URL before publishing the landing image.');
          }

          let landingUrl;
          try {
            landingUrl = new URL(value);
          } catch {
            fail('must be a valid absolute HTTPS URL.');
          }

          if (landingUrl.protocol !== 'https:') {
            fail('must use HTTPS.');
          }
          if (landingUrl.username || landingUrl.password) {
            fail('must not contain credentials.');
          }
          if (landingUrl.search || landingUrl.hash || landingUrl.href.includes('?') || landingUrl.href.includes('#')) {
            fail('must not contain a query or fragment.');
          }
          if (!value.endsWith('/')) {
            fail('must end with a trailing slash.');
          }
          NODE

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=${{ needs.prepare-release.outputs.tag_name }},enable=${{ needs.prepare-release.outputs.should_release == 'true' }}
            type=sha,format=long

      - name: Build and publish landing image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/landing/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            MACHDOCH_LANDING_URL=${{ vars.MACHDOCH_LANDING_URL }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=landing
          cache-to: type=gha,mode=max,scope=landing

      - name: Attest image provenance
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  build-and-publish-fleet-manager:
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}-fleet-manager
      SMOKE_IMAGE: machdoch-fleet-manager:smoke
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Fleet Manager image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/fleet-manager/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.SMOKE_IMAGE }}
          cache-from: type=gha,scope=fleet-manager
          cache-to: type=gha,mode=max,scope=fleet-manager

      - name: Verify Fleet Manager image
        shell: bash
        run: |
          set -euo pipefail

          container_name="fleet-manager-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          volume_name="fleet-manager-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
            docker volume rm --force "$volume_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker volume create "$volume_name" >/dev/null
          docker run --rm \
            --network host \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/apps/fleet-manager/fleet-manager.example.json,target=/config/fleet-manager.json,readonly" \
            --mount "type=volume,source=${volume_name},target=/config/data" \
            --env FLEET_MANAGER_SEED_USERNAME=owner \
            --env FLEET_MANAGER_SEED_PASSWORD=FleetSmoke-2026-Strong \
            "$SMOKE_IMAGE" seed --config /config/fleet-manager.json

          docker run --detach \
            --name "$container_name" \
            --network host \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/apps/fleet-manager/fleet-manager.example.json,target=/config/fleet-manager.json,readonly" \
            --mount "type=volume,source=${volume_name},target=/config/data" \
            "$SMOKE_IMAGE" >/dev/null

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:43188/healthz >/dev/null; then
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container_name")" != "true" ]; then
              break
            fi
            sleep 1
          done

          docker logs "$container_name"
          exit 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: fleet-metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=${{ needs.prepare-release.outputs.tag_name }},enable=${{ needs.prepare-release.outputs.should_release == 'true' }}
            type=sha,format=long

      - name: Build and publish Fleet Manager image
        id: fleet-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/fleet-manager/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.fleet-metadata.outputs.tags }}
          labels: ${{ steps.fleet-metadata.outputs.labels }}
          cache-from: type=gha,scope=fleet-manager

      - name: Attest image provenance
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.fleet-image.outputs.digest }}
          push-to-registry: true

  finalize-release-assets:
    needs: [prepare-release, build-and-release]
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.13

      - name: Remove superseded installer assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare-release.outputs.tag_name }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        shell: bash
        run: |
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json assets > release.json
          node .github/scripts/release-assets.mjs superseded "$VERSION" release.json > superseded-assets.txt

          while IFS= read -r asset; do
            [ -z "$asset" ] && continue
            gh release delete-asset "$TAG_NAME" "$asset" --yes --repo "$GITHUB_REPOSITORY"
          done < superseded-assets.txt

      - name: Verify canonical release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare-release.outputs.tag_name }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        shell: bash
        run: |
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json assets > release.json
          node .github/scripts/release-assets.mjs verify "$VERSION" release.json

  publish-release:
    needs:
      [
        prepare-release,
        finalize-release-assets,
        build-and-publish-landing,
        build-and-publish-fleet-manager,
      ]
    if: needs.prepare-release.outputs.should_release == 'true' && needs.prepare-release.outputs.publish_on_success == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare-release.outputs.tag_name }}
        run: gh release edit "$TAG_NAME" --draft=false --repo "$GITHUB_REPOSITORY"

  cleanup-release:
    name: Cleanup Draft Release on Failure
    needs:
      [
        prepare-release,
        build-and-release,
        build-and-publish-landing,
        build-and-publish-fleet-manager,
        finalize-release-assets,
        publish-release,
      ]
    if: always() && needs.prepare-release.outputs.should_release == 'true' && failure() && needs.prepare-release.outputs.delete_on_failure == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete draft release created by this workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare-release.outputs.tag_name }}
        run: gh release delete "$TAG_NAME" --yes --repo "$GITHUB_REPOSITORY"
