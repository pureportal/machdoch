[package]
name = "machdoch-layout-verification"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ryu-js = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = "0.47"
ttf-parser = "0.25.1"
