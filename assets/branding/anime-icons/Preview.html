<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Machdoch icon variants</title>
<link rel="icon" id="favicon" type="image/svg+xml" href="dash-01-classic.svg">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 "Segoe UI", system-ui, sans-serif; background: #e4e7ec; color: #0f1b2d; }
  h2 { margin: 0 0 12px; font-size: 15px; }
  img { display: block; }

  .picker { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 24px; background: rgba(228, 231, 236, .92); backdrop-filter: blur(8px); border-bottom: 1px solid #cfd5de; }
  .picker button { display: grid; justify-items: center; gap: 4px; padding: 8px; border: 2px solid transparent; border-radius: 12px; background: none; font: inherit; font-size: 12px; color: inherit; cursor: pointer; }
  .picker button:hover { background: #d6dbe3; }
  .picker button[aria-pressed="true"] { border-color: #0e2a5c; background: #fff; }

  section { padding: 24px 24px 8px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 1100px) { .pair { grid-template-columns: 1fr; } }

  .scene { padding: 24px; border-radius: 16px; background: var(--bg); color: var(--text); display: grid; place-items: center; }
  .dark { --bg: #0a101c; --panel: #111a2b; --panel-2: #172238; --border: #24314a; --text: #e6ebf5; --muted: #8a96ab; --accent: #22b8cf; --accent-text: #04202a; --placeholder: #34425c; }
  .light { --bg: #f3f5f9; --panel: #ffffff; --panel-2: #eef1f6; --border: #dce2eb; --text: #0f1b2d; --muted: #5d6b80; --accent: #0e8fa6; --accent-text: #ffffff; --placeholder: #c3cbd8; }

  .window { width: 100%; max-width: 640px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--panel); box-shadow: 0 12px 32px rgba(0, 0, 0, .25); }
  .titlebar { display: flex; align-items: center; gap: 8px; height: 32px; padding-left: 10px; font-size: 12px; border-bottom: 1px solid var(--border); }
  .titlebar .caption { margin-left: auto; display: flex; }
  .titlebar .caption span { width: 40px; text-align: center; color: var(--muted); }
  .app-body { display: grid; grid-template-columns: 200px 1fr; height: 300px; }
  .sidebar { padding: 12px; border-right: 1px solid var(--border); display: grid; align-content: start; gap: 6px; }
  .sidebar-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-weight: 600; }
  .sidebar-head .new { margin-left: auto; padding: 2px 10px; border-radius: 999px; background: var(--accent); color: var(--accent-text); font-size: 12px; font-weight: 600; }
  .session { padding: 8px 10px; border-radius: 8px; font-size: 12px; color: var(--muted); border: 1px solid transparent; }
  .session.active { background: var(--panel-2); color: var(--text); border-color: var(--border); }
  .chat { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
  .bubble { padding: 8px 12px; border-radius: 12px; font-size: 13px; background: var(--panel-2); border: 1px solid var(--border); }
  .bubble.user { align-self: flex-end; }
  .agent { display: flex; gap: 8px; align-items: flex-start; }
  .composer { margin-top: auto; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); color: var(--muted); font-size: 13px; }

  .browser { width: 100%; max-width: 560px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); background: var(--panel-2); }
  .tabs { display: flex; gap: 2px; padding: 6px 6px 0; }
  .tab { display: flex; align-items: center; gap: 8px; width: 160px; padding: 7px 10px; border-radius: 8px 8px 0 0; font-size: 12px; color: var(--muted); }
  .tab.active { background: var(--panel); color: var(--text); }
  .urlbar { height: 40px; padding: 8px 10px; background: var(--panel); }
  .urlbar div { height: 24px; border-radius: 999px; background: var(--panel-2); }
  .page { height: 64px; background: var(--panel); border-top: 1px solid var(--border); }
  .ph16 { width: 16px; height: 16px; border-radius: 4px; background: var(--placeholder); flex: none; }

  .taskbar { width: 100%; max-width: 640px; display: flex; align-items: center; height: 48px; padding: 0 8px; border-radius: 8px; background: var(--panel); border: 1px solid var(--border); }
  .taskbar .apps { flex: 1; display: flex; justify-content: center; gap: 4px; }
  .task { position: relative; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 6px; }
  .task.active { background: var(--panel-2); }
  .task.active::after { content: ""; position: absolute; bottom: 2px; width: 16px; height: 3px; border-radius: 2px; background: var(--accent); }
  .ph24 { width: 24px; height: 24px; border-radius: 6px; background: var(--placeholder); }
  .tray { display: flex; align-items: center; gap: 10px; padding: 0 6px; color: var(--text); font-size: 11px; }
  .tray svg { width: 16px; height: 16px; stroke: var(--text); fill: none; stroke-width: 1.6; stroke-linecap: round; }
  .clock { text-align: right; line-height: 1.25; }

  .toast { width: 100%; max-width: 360px; padding: 12px 14px; border-radius: 10px; background: var(--panel); border: 1px solid var(--border); box-shadow: 0 12px 32px rgba(0, 0, 0, .2); }
  .toast-head { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .toast-head span:last-child { margin-left: auto; }
  .toast-body { display: flex; gap: 12px; align-items: center; margin-top: 10px; }
  .toast-body b { display: block; }
  .toast-body span { color: var(--muted); font-size: 13px; }

  .desktop { width: 100%; max-width: 560px; height: 200px; border-radius: 10px; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, 84px); align-content: start; gap: 8px; }
  .dark .desktop { background: radial-gradient(circle at 75% 30%, #1d3a6e, #070c18 70%); }
  .light .desktop { background: radial-gradient(circle at 75% 30%, #cfe6f5, #eef2f8 70%); }
  .shortcut { display: grid; justify-items: center; gap: 4px; padding: 6px 2px; border-radius: 6px; font-size: 12px; text-align: center; }
  .shortcut.selected { background: rgba(120, 170, 255, .25); outline: 1px solid rgba(120, 170, 255, .5); }
  .dark .shortcut { color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .8); }
  .shortcut .ph48 { width: 48px; height: 48px; border-radius: 10px; background: var(--placeholder); opacity: .8; }

  .compare { width: 100%; display: grid; gap: 12px; }
  .compare .row { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px; padding: 6px; border-radius: 8px; background: var(--panel); border: 1px solid var(--border); }
  .compare button { display: grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: 6px; background: none; cursor: pointer; }
  .compare button:hover, .compare button[aria-pressed="true"] { background: var(--panel-2); }
</style>
</head>
<body>
<nav class="picker" id="picker"></nav>

<section>
  <h2>App</h2>
  <div class="pair" data-scene="app"></div>
</section>
<section>
  <h2>Browser tab</h2>
  <div class="pair" data-scene="browser"></div>
</section>
<section>
  <h2>Taskbar and tray</h2>
  <div class="pair" data-scene="taskbar"></div>
</section>
<section>
  <h2>Notification</h2>
  <div class="pair" data-scene="toast"></div>
</section>
<section>
  <h2>Desktop</h2>
  <div class="pair" data-scene="desktop"></div>
</section>
<section>
  <h2>All variants</h2>
  <div class="pair" data-scene="compare"></div>
</section>

<script>
  const icons = ['dash-01-classic', 'dash-02-double', 'dash-03-prompt', 'dash-04-tile', 'dash-05-impact', 'dash-06-comet', 'dash-07-slash', 'dash-08-eye', 'dash-09-sweat', 'dash-10-headband'];
  const icon = size => `<img class="icon" width="${size}" height="${size}" alt="">`;
  const wifi = '<svg viewBox="0 0 16 16"><path d="M2 6.5a9 9 0 0 1 12 0M4.5 9a5 5 0 0 1 7 0"/><circle cx="8" cy="12" r=".8"/></svg>';
  const volume = '<svg viewBox="0 0 16 16"><path d="M3 6h2.5L9 3v10L5.5 10H3zM11.5 6a3 3 0 0 1 0 4"/></svg>';
  const chevron = '<svg viewBox="0 0 16 16"><path d="M4 10l4-4 4 4"/></svg>';

  const scenes = {
    app: () => `
      <div class="window">
        <div class="titlebar">${icon(16)}<span>Machdoch</span><div class="caption"><span>&#8212;</span><span>&#9744;</span><span>&#10005;</span></div></div>
        <div class="app-body">
          <aside class="sidebar">
            <div class="sidebar-head">${icon(28)}<span>Sessions</span><span class="new">+ New</span></div>
            <div class="session active">Rename screenshots by date</div>
            <div class="session">Is my firewall active?</div>
            <div class="session">Quick chat</div>
          </aside>
          <div class="chat">
            <div class="bubble user">Rename the screenshots in Downloads by date</div>
            <div class="agent">${icon(28)}<div class="bubble">Done. 42 files renamed.</div></div>
            <div class="composer">What should machdoch do next?</div>
          </div>
        </div>
      </div>`,
    browser: () => `
      <div class="browser">
        <div class="tabs">
          <div class="tab active">${icon(16)}<span>Machdoch</span></div>
          <div class="tab"><span class="ph16"></span><span>Inbox</span></div>
          <div class="tab"><span class="ph16"></span><span>Docs</span></div>
        </div>
        <div class="urlbar"><div></div></div>
        <div class="page"></div>
      </div>`,
    taskbar: () => `
      <div class="taskbar">
        <div class="apps">
          <div class="task"><span class="ph24"></span></div>
          <div class="task"><span class="ph24"></span></div>
          <div class="task active">${icon(24)}</div>
          <div class="task"><span class="ph24"></span></div>
        </div>
        <div class="tray">${chevron}${icon(16)}${wifi}${volume}<div class="clock">14:32<br>14.11.2026</div></div>
      </div>`,
    toast: () => `
      <div class="toast">
        <div class="toast-head">${icon(16)}<span>Machdoch</span><span>now</span></div>
        <div class="toast-body">${icon(48)}<div><b>Task finished</b><span>42 files renamed in Downloads</span></div></div>
      </div>`,
    desktop: () => `
      <div class="desktop">
        <div class="shortcut"><span class="ph48"></span><span>Documents</span></div>
        <div class="shortcut selected">${icon(48)}<span>Machdoch</span></div>
        <div class="shortcut"><span class="ph48"></span><span>Recycle Bin</span></div>
      </div>`,
    compare: () => `
      <div class="compare">
        <div class="row">${icons.map(name => `<button data-icon="${name}" title="${name}"><img src="${name}.svg" width="24" height="24" alt="${name}"></button>`).join('')}</div>
        <div class="row">${icons.map(name => `<button data-icon="${name}" title="${name}"><img src="${name}.svg" width="16" height="16" alt="${name}"></button>`).join('')}</div>
      </div>`,
  };

  document.querySelectorAll('[data-scene]').forEach(pair => {
    const markup = scenes[pair.dataset.scene]();
    pair.innerHTML = `<div class="scene dark">${markup}</div><div class="scene light">${markup}</div>`;
  });

  document.getElementById('picker').innerHTML = icons.map(name => `
    <button data-icon="${name}"><img src="${name}.svg" width="40" height="40" alt=""><span>${name}</span></button>`).join('');

  function select(name) {
    document.querySelectorAll('img.icon').forEach(img => { img.src = `${name}.svg`; });
    document.querySelectorAll('[data-icon]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.icon === name)));
    document.getElementById('favicon').href = `${name}.svg`;
    history.replaceState(null, '', `#${name}`);
  }

  document.addEventListener('click', event => {
    const button = event.target.closest('[data-icon]');
    if (button) select(button.dataset.icon);
  });

  const initial = location.hash.slice(1);
  select(icons.includes(initial) ? initial : icons[0]);
</script>
</body>
</html>
